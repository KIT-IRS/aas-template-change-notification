# Template Change Notification: IDTA 02017 Asset Interfaces Description v1.1 -> v1.2 (intent, hand-written)
#
# This file states the intent of the revision. `uv run tcn owner complete` appends the mechanical
# completion; the result is aid_1.1_to_1.2.yaml.
# The change log of v1.2 (Annex G) lists the new SNMP and CAN bindings, the IO-Link binding becoming
# normative, protocolVersion, base becoming optional and the changed semanticId of the submodel; all
# are additions or attribute values, stated by the mechanical completion. It lists iolv_accessRights
# as new, whereas v1.1 carries it as iolv_accessRigths (D3). Not in the change log, taken from the
# published templates: the lists enum and the nested observable are removed from all property
# definitions, the nested members of bacv_hasDataType are removed, and the semanticId of the entries
# of security changes from hasSecurityConfiguration to definesSecurityScheme.
# v1.1 is its bug-fix release 1.1.1, the latest of v1.1. v1.2 carries the submodel id of v1.0.

