- title: 'B4: ContactInformation becomes AddressInformation, the use of the SMT drop-in Address Information'
  origin: rule
  rule:
    RenameContainer:
      ContactInformation: AddressInformation
  items:
  - ChangeOperation: CreateSME
    ElementPath: AddressInformation
    SMEType: SubmodelElementCollection
  - ChangeOperation: CreateAttr
    ElementPath: AddressInformation
    AttributeKey: description
  - ChangeOperation: UpdateAttr
    ElementPath: AddressInformation
    AttributeKey: description
    AttributeValue:
    - language: en
      text: 'The SMC “ContactInformation” contains information on how to contact the manufacturer or an authorised service
        provider, e.g. when a maintenance service is required. Note: physical address is a mandatory property according to
        EU Machine Directive 2006/42/EC'
  - ChangeOperation: CreateAttr
    ElementPath: AddressInformation
    AttributeKey: semanticId
  - ChangeOperation: UpdateAttr
    ElementPath: AddressInformation
    AttributeKey: semanticId
    AttributeValue:
      type: ExternalReference
      keys:
      - type: GlobalReference
        value: https://admin-shell.io/zvei/nameplate/1/0/ContactInformations/ContactInformation
  - ChangeOperation: CreateQual
    ElementPath: AddressInformation
    QualifierType: Multiplicity
  - ChangeOperation: UpdateAttr
    ElementPath: AddressInformation
    QualifierType: Multiplicity
    AttributeKey: valueType
    AttributeValue: xs:string
  - ChangeOperation: CreateAttr
    ElementPath: AddressInformation
    QualifierType: Multiplicity
    AttributeKey: value
  - ChangeOperation: Sync
    SourceElementPaths:
    - ContactInformation@Multiplicity#value
    TargetElementPaths:
    - AddressInformation@Multiplicity#value
    TransferFunction:
