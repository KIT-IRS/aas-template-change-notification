- title: 'K6: PublicationDate and ExpirationDate become dates with time (xs:dateTime)'
  origin: hand
  items:
  - ChangeOperation: UpdateAttr
    ElementPath: ProductCarbonFootprints[0].PublicationDate
    AttributeKey: valueType
    AttributeValue: xs:dateTime
  - ChangeOperation: CreateAttr
    ElementPath: ProductCarbonFootprints[0].PublicationDate
    AttributeKey: value
  - ChangeOperation: Sync
    SourceElementPaths:
    - ProductCarbonFootprints[0].PublicationDate#value
    TargetElementPaths:
    - ProductCarbonFootprints[0].PublicationDate#value
    TransferFunction:
      Kind: Expression
      ExpressionLanguage: https://github.com/google/cel-spec
      Expression: 'type(src[0]) != string ? null : src[0].contains("T") ? src[0] : src[0] + "T00:00:00Z"'
      Text:
        en: Write the date as a date and time (xs:dateTime), at 00:00:00 UTC unless a time is given.
  - ChangeOperation: UpdateAttr
    ElementPath: ProductCarbonFootprints[0].ExpirationDate
    AttributeKey: valueType
