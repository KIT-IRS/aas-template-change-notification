# Template Change Notification: IDTA 02003 Technical Data v1.2 -> v2.0 (intent, hand-written)
#
# This file states the intent of the revision. `uv run tcn owner complete` expands the rules and
# appends the mechanical, attribute-level completion; the result is technicaldata_1.2_to_2.0.yaml.
# Groups G2-G8 follow the change log of IDTA 02003 v2.0 (Annex B); G8 is listed there only as part of
# the update to schema version 3.0. G1 is not in the change log; it is taken from the published
# templates. The change log also lists a rename of ClassificationSystemVersion, which the published
# templates do not carry out; the chain therefore does not state it.

header:
  Family: TechnicalData
  PreVersion: https://admin-shell.io/ZVEI/TechnicalData/Submodel/1/2
  PostVersion: https://admin-shell.io/idta/SubmodelTemplate/TechnicalData/2/0
  PreTemplate: ressources/Templates/IDTA_02003-1-2_Template_TechnicalData.json
  PostTemplate: ressources/Templates/IDTA 02003_2-0-1_Template_TechnicalData.json
  TemplateOwner: Industrial Digital Twin Association (IDTA)
  TemplateOwnerAddress:
    Company: Industrial Digital Twin Association e.V.
    Street: Lyoner Straße 18
    Zipcode: "60528"
    CityTown: Frankfurt am Main
    NationalCode: DE
  ChangeURI: https://github.com/admin-shell-io/submodel-templates/tree/main/published/Technical_Data/2/0

sections:
  - title: "G1: ManufacturerLogo is renamed to CompanyLogo"
    origin: hand
    items:
      - {ChangeOperation: UpdateIdShort, ElementPath: GeneralInformation.ManufacturerLogo, NewIdShort: CompanyLogo}

  - title: "G2: ProductImage (File, 0..*) becomes the list ProductImages whose entries hold ImageFile"
    origin: hand
    items:
      - {ChangeOperation: CreateSME, ElementPath: GeneralInformation.ProductImages, SMEType: SubmodelElementList}
      - {ChangeOperation: UpdateAttr, ElementPath: GeneralInformation.ProductImages,
         AttributeKey: typeValueListElement, AttributeValue: SubmodelElementCollection}
      - {ChangeOperation: CreateSME, ElementPath: "GeneralInformation.ProductImages[0]", SMEType: SubmodelElementCollection}
      # the multiplicity of the images moves from the file to the list (0..* -> list 0..1)
      - {ChangeOperation: CreateQual, ElementPath: GeneralInformation.ProductImages, QualifierType: SMT/Cardinality}
      - {ChangeOperation: UpdateAttr, ElementPath: GeneralInformation.ProductImages, QualifierType: SMT/Cardinality,
         AttributeKey: valueType, AttributeValue: xs:string}
      - {ChangeOperation: CreateAttr, ElementPath: GeneralInformation.ProductImages, QualifierType: SMT/Cardinality,
         AttributeKey: value}
      - ChangeOperation: Sync
        SourceElementPaths: ["GeneralInformation.ProductImage@Cardinality#value"]
        TargetElementPaths: ["GeneralInformation.ProductImages@SMT/Cardinality#value"]
        TransferFunction: {Kind: ValueMap, Pairs: {ZeroToMany: ZeroToOne}}
      - {ChangeOperation: RemoveQual, ElementPath: GeneralInformation.ProductImage, QualifierType: Cardinality}
      # the file itself is retained: it moves into the list entry and is renamed
      - {ChangeOperation: UpdateParent, ElementPath: GeneralInformation.ProductImage,
         NewParentPath: "GeneralInformation.ProductImages[0]"}
      - {ChangeOperation: UpdateIdShort, ElementPath: "GeneralInformation.ProductImages[0].ProductImage",
         NewIdShort: ImageFile}
      # each entry holds exactly one file
      - {ChangeOperation: CreateQual, ElementPath: "GeneralInformation.ProductImages[0].ImageFile",
         QualifierType: SMT/Cardinality}
      - {ChangeOperation: UpdateAttr, ElementPath: "GeneralInformation.ProductImages[0].ImageFile",
         QualifierType: SMT/Cardinality, AttributeKey: valueType, AttributeValue: xs:string}
      - {ChangeOperation: CreateAttr, ElementPath: "GeneralInformation.ProductImages[0].ImageFile",
         QualifierType: SMT/Cardinality, AttributeKey: value}
      - {ChangeOperation: UpdateAttr, ElementPath: "GeneralInformation.ProductImages[0].ImageFile",
         QualifierType: SMT/Cardinality, AttributeKey: value, AttributeValue: One}

  - title: "G4: ProductClassifications becomes a list; each ProductClassificationItem becomes a list entry"
    origin: hand
    items:
      # the properties of an item are retained; they are parked at the root while the containers are replaced
      - {ChangeOperation: UpdateParent, ElementPath: ProductClassifications.ProductClassificationItem.ProductClassificationSystem,
         NewParentPath: ""}
      - {ChangeOperation: UpdateParent, ElementPath: ProductClassifications.ProductClassificationItem.ClassificationSystemVersion,
         NewParentPath: ""}
      - {ChangeOperation: UpdateParent, ElementPath: ProductClassifications.ProductClassificationItem.ProductClassId,
         NewParentPath: ""}
      # the multiplicity of the items (0..*) is now expressed by the list itself
      - {ChangeOperation: RemoveQual, ElementPath: ProductClassifications.ProductClassificationItem, QualifierType: Cardinality}
      - {ChangeOperation: RemoveQual, ElementPath: ProductClassifications.ProductClassificationItem, QualifierType: AllowedIdShort}
      - {ChangeOperation: RemoveSME, ElementPath: ProductClassifications.ProductClassificationItem}
      # an element's type cannot be updated: the list is created beside the collection, takes over
      # its cardinality constraint, and is renamed once the collection is removed
      - {ChangeOperation: CreateSME, ElementPath: ProductClassificationsList, SMEType: SubmodelElementList}
      - {ChangeOperation: UpdateAttr, ElementPath: ProductClassificationsList,
         AttributeKey: typeValueListElement, AttributeValue: SubmodelElementCollection}
      - {ChangeOperation: CreateQual, ElementPath: ProductClassificationsList, QualifierType: SMT/Cardinality}
      - {ChangeOperation: UpdateAttr, ElementPath: ProductClassificationsList, QualifierType: SMT/Cardinality,
         AttributeKey: valueType, AttributeValue: xs:string}
      - {ChangeOperation: CreateAttr, ElementPath: ProductClassificationsList, QualifierType: SMT/Cardinality,
         AttributeKey: value}
      - ChangeOperation: Sync
        SourceElementPaths: ["ProductClassifications@Cardinality#value"]
        TargetElementPaths: ["ProductClassificationsList@SMT/Cardinality#value"]
        TransferFunction: {Kind: Identity}
      - {ChangeOperation: RemoveQual, ElementPath: ProductClassifications, QualifierType: Cardinality}
      - {ChangeOperation: RemoveSME, ElementPath: ProductClassifications}
      - {ChangeOperation: UpdateIdShort, ElementPath: ProductClassificationsList, NewIdShort: ProductClassifications}
      # the parked properties move into the list entry
      - {ChangeOperation: CreateSME, ElementPath: "ProductClassifications[0]", SMEType: SubmodelElementCollection}
      - {ChangeOperation: UpdateParent, ElementPath: ProductClassificationSystem, NewParentPath: "ProductClassifications[0]"}
      - {ChangeOperation: UpdateParent, ElementPath: ClassificationSystemVersion, NewParentPath: "ProductClassifications[0]"}
      - {ChangeOperation: UpdateParent, ElementPath: ProductClassId, NewParentPath: "ProductClassifications[0]"}
      # G4a: ProductClassificationSystem is renamed to ClassificationSystem
      - {ChangeOperation: UpdateIdShort, ElementPath: "ProductClassifications[0].ProductClassificationSystem",
         NewIdShort: ClassificationSystem}

  - title: "G5: TechnicalProperties becomes the list TechnicalPropertyAreas (paper, Table 3)"
    origin: hand
    items:
      - {ChangeOperation: CreateSME, ElementPath: TechnicalPropertyAreas, SMEType: SubmodelElementList}
      - {ChangeOperation: UpdateAttr, ElementPath: TechnicalPropertyAreas,
         AttributeKey: typeValueListElement, AttributeValue: SubmodelElementCollection}
      - {ChangeOperation: CreateSME, ElementPath: "TechnicalPropertyAreas[0]", SMEType: SubmodelElementCollection}
      # the technical properties are retained and move into the list entry
      - {ChangeOperation: UpdateParent, ElementPath: TechnicalProperties.ID___arbitrary1__,
         NewParentPath: "TechnicalPropertyAreas[0]"}
      - {ChangeOperation: UpdateIdShort, ElementPath: "TechnicalPropertyAreas[0].ID___arbitrary1__", NewIdShort: ArbitraryMLP}
      - {ChangeOperation: UpdateParent, ElementPath: TechnicalProperties.ID___arbitrary2__,
         NewParentPath: "TechnicalPropertyAreas[0]"}
      - {ChangeOperation: UpdateIdShort, ElementPath: "TechnicalPropertyAreas[0].ID___arbitrary2__",
         NewIdShort: ArbitraryProperty}
      # MainSection becomes Section, its SubSection becomes the nested Section. A container is only
      # moved without children: the SubSection is moved out first and back in afterwards.
      - {ChangeOperation: UpdateParent, ElementPath: TechnicalProperties.MainSection.SubSection,
         NewParentPath: "TechnicalPropertyAreas[0]"}
      - {ChangeOperation: UpdateParent, ElementPath: TechnicalProperties.MainSection, NewParentPath: "TechnicalPropertyAreas[0]"}
      - {ChangeOperation: UpdateIdShort, ElementPath: "TechnicalPropertyAreas[0].MainSection", NewIdShort: Section}
      - {ChangeOperation: UpdateParent, ElementPath: "TechnicalPropertyAreas[0].SubSection",
         NewParentPath: "TechnicalPropertyAreas[0].Section"}
      - {ChangeOperation: UpdateIdShort, ElementPath: "TechnicalPropertyAreas[0].Section.SubSection", NewIdShort: Section}
      # the SubSection directly below TechnicalProperties has no counterpart in v2.0
      - {ChangeOperation: RemoveQual, ElementPath: TechnicalProperties.SubSection, QualifierType: Cardinality}
      - {ChangeOperation: RemoveQual, ElementPath: TechnicalProperties.SubSection, QualifierType: AllowedIdShort}
      - {ChangeOperation: RemoveSME, ElementPath: TechnicalProperties.SubSection}
      # the cardinality constraint is relocated to the list and relaxed from One to ZeroToOne
      - {ChangeOperation: CreateQual, ElementPath: TechnicalPropertyAreas, QualifierType: SMT/Cardinality}
      - {ChangeOperation: UpdateAttr, ElementPath: TechnicalPropertyAreas, QualifierType: SMT/Cardinality,
         AttributeKey: valueType, AttributeValue: xs:string}
      - {ChangeOperation: CreateAttr, ElementPath: TechnicalPropertyAreas, QualifierType: SMT/Cardinality,
         AttributeKey: value}
      - ChangeOperation: Sync
        SourceElementPaths: ["TechnicalProperties@Cardinality#value"]
        TargetElementPaths: ["TechnicalPropertyAreas@SMT/Cardinality#value"]
        TransferFunction: {Kind: ValueMap, Pairs: {One: ZeroToOne}}
      - {ChangeOperation: RemoveQual, ElementPath: TechnicalProperties, QualifierType: Cardinality}
      - {ChangeOperation: RemoveSME, ElementPath: TechnicalProperties}

  - title: "G8: the cardinality vocabulary changes from Cardinality to SMT/Cardinality"
    origin: rule
    rule:
      QualifierTypeRenames: {Cardinality: SMT/Cardinality}
