      - {ChangeOperation: UpdateAttr, ElementPath: "Markings[0].ExpiryDate", AttributeKey: valueType, AttributeValue: xs:date}

  - title: "B6: YearOfConstruction becomes optional"
    origin: hand
    items:
      - {ChangeOperation: CreateQual, ElementPath: YearOfConstruction, QualifierType: SMT/Cardinality}
      - {ChangeOperation: UpdateAttr, ElementPath: YearOfConstruction, QualifierType: SMT/Cardinality,
         AttributeKey: valueType, AttributeValue: xs:string}
      - {ChangeOperation: CreateAttr, ElementPath: YearOfConstruction, QualifierType: SMT/Cardinality, AttributeKey: value}
      - {ChangeOperation: Sync, SourceElementPaths: ["YearOfConstruction@Multiplicity#value"],
         TargetElementPaths: ["YearOfConstruction@SMT/Cardinality#value"],
         TransferFunction: {Kind: ValueMap, Pairs: {One: ZeroToOne}}}
      - {ChangeOperation: RemoveQual, ElementPath: YearOfConstruction, QualifierType: Multiplicity}

  - title: "B5: UniqueFacilityIdentifier is added"
    origin: hand
    items:
      - {ChangeOperation: CreateSME, ElementPath: UniqueFacilityIdentifier, SMEType: Property}
      - {ChangeOperation: UpdateAttr, ElementPath: UniqueFacilityIdentifier, AttributeKey: valueType, AttributeValue: xs:string}

  - title: "B1: the cardinality vocabulary changes from Multiplicity to SMT/Cardinality"
