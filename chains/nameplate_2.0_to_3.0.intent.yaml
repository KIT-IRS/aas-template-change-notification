      - {ChangeOperation: RemoveQual, ElementPath: OrderCodeOfManufacturer, QualifierType: Multiplicity}
      - {ChangeOperation: RemoveSME, ElementPath: OrderCodeOfManufacturer}
      - {ChangeOperation: UpdateIdShort, ElementPath: OrderCodeOfManufacturerRetyped, NewIdShort: OrderCodeOfManufacturer}
      # ProductArticleNumberOfManufacturer
      - {ChangeOperation: CreateSME, ElementPath: ProductArticleNumberOfManufacturerRetyped, SMEType: Property}
      - {ChangeOperation: UpdateAttr, ElementPath: ProductArticleNumberOfManufacturerRetyped, AttributeKey: valueType, AttributeValue: xs:string}
      - {ChangeOperation: CreateAttr, ElementPath: ProductArticleNumberOfManufacturerRetyped, AttributeKey: value}
      - {ChangeOperation: Sync, SourceElementPaths: ["ProductArticleNumberOfManufacturer#value"], TargetElementPaths: ["ProductArticleNumberOfManufacturerRetyped#value"],
         TransferFunction: *mlp_to_string}
      - {ChangeOperation: CreateQual, ElementPath: ProductArticleNumberOfManufacturerRetyped, QualifierType: SMT/Cardinality}
      - {ChangeOperation: UpdateAttr, ElementPath: ProductArticleNumberOfManufacturerRetyped, QualifierType: SMT/Cardinality, AttributeKey: valueType,
         AttributeValue: xs:string}
      - {ChangeOperation: CreateAttr, ElementPath: ProductArticleNumberOfManufacturerRetyped, QualifierType: SMT/Cardinality, AttributeKey: value}
      - {ChangeOperation: Sync, SourceElementPaths: ["ProductArticleNumberOfManufacturer@Multiplicity#value"],
         TargetElementPaths: ["ProductArticleNumberOfManufacturerRetyped@SMT/Cardinality#value"], TransferFunction: {Kind: Identity}}
      - {ChangeOperation: RemoveQual, ElementPath: ProductArticleNumberOfManufacturer, QualifierType: Multiplicity}
      - {ChangeOperation: RemoveSME, ElementPath: ProductArticleNumberOfManufacturer}
      - {ChangeOperation: UpdateIdShort, ElementPath: ProductArticleNumberOfManufacturerRetyped, NewIdShort: ProductArticleNumberOfManufacturer}
      # HardwareVersion
      - {ChangeOperation: CreateSME, ElementPath: HardwareVersionRetyped, SMEType: Property}
      - {ChangeOperation: UpdateAttr, ElementPath: HardwareVersionRetyped, AttributeKey: valueType, AttributeValue: xs:string}
      - {ChangeOperation: CreateAttr, ElementPath: HardwareVersionRetyped, AttributeKey: value}
      - {ChangeOperation: Sync, SourceElementPaths: ["HardwareVersion#value"], TargetElementPaths: ["HardwareVersionRetyped#value"],
         TransferFunction: *mlp_to_string}
      - {ChangeOperation: CreateQual, ElementPath: HardwareVersionRetyped, QualifierType: SMT/Cardinality}
      - {ChangeOperation: UpdateAttr, ElementPath: HardwareVersionRetyped, QualifierType: SMT/Cardinality, AttributeKey: valueType,
         AttributeValue: xs:string}
