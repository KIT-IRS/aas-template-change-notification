      - {ChangeOperation: Sync, SourceElementPaths: ["HardwareVersion@Multiplicity#value"],
         TargetElementPaths: ["HardwareVersionRetyped@SMT/Cardinality#value"], TransferFunction: {Kind: Identity}}
      - {ChangeOperation: RemoveQual, ElementPath: HardwareVersion, QualifierType: Multiplicity}
      - {ChangeOperation: RemoveSME, ElementPath: HardwareVersion}
      - {ChangeOperation: UpdateIdShort, ElementPath: HardwareVersionRetyped, NewIdShort: HardwareVersion}
      # FirmwareVersion
      - {ChangeOperation: CreateSME, ElementPath: FirmwareVersionRetyped, SMEType: Property}
