    ElementPath: Interfaces.Interface
    NewIdShort: InterfaceReference
  - ChangeOperation: CreateSME
    ElementPath: Interfaces.Interface
    SMEType: SubmodelElementCollection
  - ChangeOperation: UpdateParent
    ElementPath: Interfaces.InterfaceReference
    NewParentPath: Interfaces.Interface
  - ChangeOperation: CreateQual
    ElementPath: Interfaces.Interface
    QualifierType: SMT/SMT/Cardinality
  - ChangeOperation: UpdateAttr
    ElementPath: Interfaces.Interface
    QualifierType: SMT/SMT/Cardinality
    AttributeKey: valueType
    AttributeValue: xs:string
  - ChangeOperation: CreateAttr
    ElementPath: Interfaces.Interface
    QualifierType: SMT/SMT/Cardinality
    AttributeKey: value
  - ChangeOperation: Sync
    SourceElementPaths:
    - Interfaces.Interface.InterfaceReference@Multiplicity#value
    TargetElementPaths:
    - Interfaces.Interface@SMT/SMT/Cardinality#value
    TransferFunction:
      Kind: Identity
  - ChangeOperation: CreateQual
    ElementPath: Interfaces.Interface.InterfaceReference
    QualifierType: SMT/SMT/Cardinality
  - ChangeOperation: UpdateAttr
    ElementPath: Interfaces.Interface.InterfaceReference
    QualifierType: SMT/SMT/Cardinality
    AttributeKey: valueType
    AttributeValue: xs:string
  - ChangeOperation: CreateAttr
    ElementPath: Interfaces.Interface.InterfaceReference
    QualifierType: SMT/SMT/Cardinality
    AttributeKey: value
  - ChangeOperation: UpdateAttr
    ElementPath: Interfaces.Interface.InterfaceReference
    QualifierType: SMT/SMT/Cardinality
    AttributeKey: value
    AttributeValue: ZeroToOne
  - ChangeOperation: RemoveQual
    ElementPath: Interfaces.Interface.InterfaceReference
    QualifierType: Multiplicity
- title: 'C3: SMC Error replaces MLP ErrorCode in SMC Errors; its code is the idShort of the former ErrorCode'
  origin: hand
  items:
  - ChangeOperation: UpdateIdShort
    ElementPath: Errors.ErrorCode
    NewIdShort: FormerErrorCode
  - ChangeOperation: CreateSME
    ElementPath: Errors.Error
    SMEType: SubmodelElementCollection
  - ChangeOperation: UpdateParent
    ElementPath: Errors.FormerErrorCode
    NewParentPath: Errors.Error
  - ChangeOperation: CreateSME
    ElementPath: Errors.Error.ErrorCode
    SMEType: Property
  - ChangeOperation: UpdateAttr
    ElementPath: Errors.Error.ErrorCode
    AttributeKey: valueType
    AttributeValue: xs:string
  - ChangeOperation: CreateAttr
    ElementPath: Errors.Error.ErrorCode
    AttributeKey: value
  - ChangeOperation: Sync
    SourceElementPaths:
    - Errors.Error.FormerErrorCode#value
    TargetElementPaths:
    - Errors.Error.ErrorCode#value
    TransferFunction:
      Kind: Instruction
      Text:
        en: Set ErrorCode to the idShort of the former MLP ErrorCode, and take its text as the description of the collection
          Error.
  - ChangeOperation: CreateQual
    ElementPath: Errors.Error
    QualifierType: SMT/SMT/Cardinality
  - ChangeOperation: UpdateAttr
    ElementPath: Errors.Error
    QualifierType: SMT/SMT/Cardinality
    AttributeKey: valueType
    AttributeValue: xs:string
  - ChangeOperation: CreateAttr
    ElementPath: Errors.Error
    QualifierType: SMT/SMT/Cardinality
    AttributeKey: value
  - ChangeOperation: Sync
    SourceElementPaths:
    - Errors.Error.FormerErrorCode@Multiplicity#value
    TargetElementPaths:
    - Errors.Error@SMT/SMT/Cardinality#value
    TransferFunction:
      Kind: Identity
  - ChangeOperation: RemoveQual
    ElementPath: Errors.Error.FormerErrorCode
    QualifierType: Multiplicity
  - ChangeOperation: CreateQual
    ElementPath: Errors.Error
    QualifierType: PresetIdShort
  - ChangeOperation: UpdateAttr
    ElementPath: Errors.Error
    QualifierType: PresetIdShort
    AttributeKey: valueType
    AttributeValue: xs:string
  - ChangeOperation: CreateAttr
    ElementPath: Errors.Error
    QualifierType: PresetIdShort
    AttributeKey: value
  - ChangeOperation: Sync
    SourceElementPaths:
    - Errors.Error.FormerErrorCode@PresetIdShort#value
    TargetElementPaths:
    - Errors.Error@PresetIdShort#value
    TransferFunction:
      Kind: Identity
  - ChangeOperation: RemoveQual
    ElementPath: Errors.Error.FormerErrorCode
    QualifierType: PresetIdShort
  - ChangeOperation: RemoveSME
    ElementPath: Errors.Error.FormerErrorCode
- title: 'C4: the Name property is removed from the Skill and Parameter SMCs in favor of freely choosable idShort values'
  origin: rule
  rule:
    RemoveSubtree:
    - Skills.Skill.Name
    - Skills.Skill.Parameters.Parameter.Name
  items:
  - ChangeOperation: RemoveQual
    ElementPath: Skills.Skill.Name
    QualifierType: Multiplicity
  - ChangeOperation: RemoveSME
    ElementPath: Skills.Skill.Name
  - ChangeOperation: RemoveQual
    ElementPath: Skills.Skill.Parameters.Parameter.Name
    QualifierType: Multiplicity
  - ChangeOperation: RemoveSME
    ElementPath: Skills.Skill.Parameters.Parameter.Name
- title: 'C5: the DisplayName MLP is removed from the Skill SMC, as it is now represented in the AAS metamodel'
  origin: rule
  rule:
    RemoveSubtree:
    - Skills.Skill.DisplayName
  items:
  - ChangeOperation: RemoveQual
    ElementPath: Skills.Skill.DisplayName
    QualifierType: Multiplicity
