# SMT drop-ins the demonstrator can resolve. A published template marks an element as the use of a
# drop-in (supplementalSemanticId https://admin-shell.io/smt-dropin/smt-dropin-use/1/0) and leaves
# its content to the drop-in. The content is taken from the element `element` of the template
# `source`; `mandatory` lists the children the using templates declare mandatory.

- name: Address Information
  semanticId: https://admin-shell.io/zvei/nameplate/1/0/ContactInformations/AddressInformation
  # IDTA 02006-3-0 §3.4: "SMC AddressInformation is part of SMC ContactInformation of SMT
  # ContactInformations [IDTA 02002]"
  source: ressources/Templates/IDTA 02002-1-0-2_Template_ContactInformation_forAASMetamodelV3.1.json
  element: ContactInformation
  # IDTA 02006-3-0 §3.4: "The following SubmodelElements shall be specified within SMC
  # AddressInformation" (listed in the document only, not in the AASX file)
  mandatory: [Street, Zipcode, CityTown, NationalCode]
