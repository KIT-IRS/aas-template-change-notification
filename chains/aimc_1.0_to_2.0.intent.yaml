# Template Change Notification: IDTA 02027 Asset Interfaces Mapping Configuration v1.0 -> v2.0 (intent, hand-written)
#
# This file states the intent of the revision. `uv run tcn owner complete` appends the mechanical
# completion; the result is aimc_1.0_to_2.0.yaml.
# Groups A1-A4 follow the change log of IDTA 02027 v2.0 (Annex C); the changed descriptions and
# semanticIds and the new DefaultPollingInterval and Transformation are stated by the mechanical
# completion. The change log lists the removal of MappingSourceSinkRelations and the addition of
# Sources and Sinks separately; by the specification, the first element of a relation is the source of
# the mapping and the second its sink (A2). That the entries of MappingConfigurations, Sources and
# Sinks carry the idShorts MappingConfiguration, Source and Sink in v2.0 (A0, A2; removed again in
# v2.1) is not in the change log.

header:
  Family: AssetInterfacesMappingConfiguration
  PreVersion: https://admin-shell.io/idta/SubmodelTemplate/AssetInterfacesMappingConfiguration/1/0/
  PostVersion: https://admin-shell.io/idta/SubmodelTemplate/AssetInterfacesMappingConfiguration/2/0
  PreTemplate: ressources/Templates/IDTA 02027-1-0-1_Template_AIMC.json
  PostTemplate: ressources/Templates/IDTA 02027-2-0_Template_AIMC.json
  TemplateOwner: Industrial Digital Twin Association (IDTA)
  TemplateOwnerAddress:
    Company: Industrial Digital Twin Association e.V.
    Street: Lyoner Straße 18
    Zipcode: "60528"
    CityTown: Frankfurt am Main
    NationalCode: DE
  ChangeURI: https://github.com/admin-shell-io/submodel-templates/tree/main/published/Asset%20Interfaces%20Mapping%20Configuration/2/0

sections:
  - title: "A0: the entry of MappingConfigurations is named MappingConfiguration; it is rebuilt under its name"
    origin: hand
    items:
      # the new entry takes over the semantics of the entry it replaces (the semanticId of v2.0 is set
      # by the completion), so that every configuration yields one new entry
      - {ChangeOperation: CreateSME, ElementPath: MappingConfigurations.MappingConfiguration, SMEType: SubmodelElementCollection}
      - {ChangeOperation: CreateAttr, ElementPath: "MappingConfigurations[1]", AttributeKey: semanticId}
      - {ChangeOperation: Sync, SourceElementPaths: ["MappingConfigurations[0]#semanticId"],
         TargetElementPaths: ["MappingConfigurations[1]#semanticId"], TransferFunction: {Kind: Identity}}
      - {ChangeOperation: CreateQual, ElementPath: "MappingConfigurations[1]", QualifierType: SMT/Cardinality}
      - {ChangeOperation: UpdateAttr, ElementPath: "MappingConfigurations[1]", QualifierType: SMT/Cardinality, AttributeKey: valueType,
         AttributeValue: xs:string}
      - {ChangeOperation: CreateAttr, ElementPath: "MappingConfigurations[1]", QualifierType: SMT/Cardinality, AttributeKey: value}
      - {ChangeOperation: Sync, SourceElementPaths: ["MappingConfigurations[0]@SMT/Cardinality#value"],
         TargetElementPaths: ["MappingConfigurations[1]@SMT/Cardinality#value"], TransferFunction: {Kind: Identity}}
      - {ChangeOperation: RemoveQual, ElementPath: "MappingConfigurations[0]", QualifierType: SMT/Cardinality}

  - title: "A2: SML Sources and SML Sinks replace SML MappingSourceSinkRelations; each relation yields one source and one sink"
    origin: hand
    items:
      - {ChangeOperation: CreateSME, ElementPath: "MappingConfigurations[1].Sources", SMEType: SubmodelElementList}
      - {ChangeOperation: UpdateAttr, ElementPath: "MappingConfigurations[1].Sources", AttributeKey: typeValueListElement,
         AttributeValue: SubmodelElementCollection}
      - {ChangeOperation: CreateSME, ElementPath: "MappingConfigurations[1].Sinks", SMEType: SubmodelElementList}
      - {ChangeOperation: UpdateAttr, ElementPath: "MappingConfigurations[1].Sinks", AttributeKey: typeValueListElement,
         AttributeValue: SubmodelElementCollection}
      # the relation passes through its source entry and its sink entry, so that each relation yields
      # one of each; it is named while it is not in a list. v2.0 names the entries of Sources and Sinks too.
      - {ChangeOperation: UpdateIdShort, ElementPath: "MappingConfigurations[0].MappingSourceSinkRelations[0]", NewIdShort: Relation}
      - {ChangeOperation: CreateSME, ElementPath: "MappingConfigurations[1].Sources.Source", SMEType: SubmodelElementCollection}
      - {ChangeOperation: UpdateParent, ElementPath: "MappingConfigurations[0].MappingSourceSinkRelations[0]",
         NewParentPath: "MappingConfigurations[1].Sources[0]"}
      - {ChangeOperation: CreateSME, ElementPath: "MappingConfigurations[1].Sources[0].Source", SMEType: ReferenceElement}
      - {ChangeOperation: CreateAttr, ElementPath: "MappingConfigurations[1].Sources[0].Source", AttributeKey: value}
      - {ChangeOperation: Sync, SourceElementPaths: ["MappingConfigurations[1].Sources[0].Relation#first"],
         TargetElementPaths: ["MappingConfigurations[1].Sources[0].Source#value"], TransferFunction: {Kind: Identity}}
      - {ChangeOperation: CreateSME, ElementPath: "MappingConfigurations[1].Sinks.Sink", SMEType: SubmodelElementCollection}
      - {ChangeOperation: UpdateParent, ElementPath: "MappingConfigurations[1].Sources[0].Relation",
         NewParentPath: "MappingConfigurations[1].Sinks[0]"}
      - {ChangeOperation: CreateSME, ElementPath: "MappingConfigurations[1].Sinks[0].Sink", SMEType: ReferenceElement}
      - {ChangeOperation: CreateAttr, ElementPath: "MappingConfigurations[1].Sinks[0].Sink", AttributeKey: value}
      - {ChangeOperation: Sync, SourceElementPaths: ["MappingConfigurations[1].Sinks[0].Relation#second"],
         TargetElementPaths: ["MappingConfigurations[1].Sinks[0].Sink#value"], TransferFunction: {Kind: Identity}}
      # the repeatability of the relation now constrains the source and the sink entries
      - {ChangeOperation: CreateQual, ElementPath: "MappingConfigurations[1].Sources[0]", QualifierType: SMT/Cardinality}
      - {ChangeOperation: UpdateAttr, ElementPath: "MappingConfigurations[1].Sources[0]", QualifierType: SMT/Cardinality,
         AttributeKey: valueType, AttributeValue: xs:string}
      - {ChangeOperation: CreateAttr, ElementPath: "MappingConfigurations[1].Sources[0]", QualifierType: SMT/Cardinality, AttributeKey: value}
      - {ChangeOperation: Sync, SourceElementPaths: ["MappingConfigurations[1].Sinks[0].Relation@SMT/Cardinality#value"],
         TargetElementPaths: ["MappingConfigurations[1].Sources[0]@SMT/Cardinality#value"], TransferFunction: {Kind: Identity}}
      - {ChangeOperation: CreateQual, ElementPath: "MappingConfigurations[1].Sinks[0]", QualifierType: SMT/Cardinality}
      - {ChangeOperation: UpdateAttr, ElementPath: "MappingConfigurations[1].Sinks[0]", QualifierType: SMT/Cardinality,
         AttributeKey: valueType, AttributeValue: xs:string}
      - {ChangeOperation: CreateAttr, ElementPath: "MappingConfigurations[1].Sinks[0]", QualifierType: SMT/Cardinality, AttributeKey: value}
      - {ChangeOperation: Sync, SourceElementPaths: ["MappingConfigurations[1].Sinks[0].Relation@SMT/Cardinality#value"],
         TargetElementPaths: ["MappingConfigurations[1].Sinks[0]@SMT/Cardinality#value"], TransferFunction: {Kind: Identity}}
      - {ChangeOperation: RemoveQual, ElementPath: "MappingConfigurations[1].Sinks[0].Relation", QualifierType: SMT/Cardinality}
      - {ChangeOperation: RemoveSME, ElementPath: "MappingConfigurations[1].Sinks[0].Relation"}
      - {ChangeOperation: RemoveQual, ElementPath: "MappingConfigurations[0].MappingSourceSinkRelations", QualifierType: SMT/Cardinality}
      - {ChangeOperation: RemoveSME, ElementPath: "MappingConfigurations[0].MappingSourceSinkRelations"}

  - title: "A3: ReferenceElement InterfaceReference is removed, since the AID submodel can be inferred from each Source"
    origin: hand
    items:
      - {ChangeOperation: RemoveQual, ElementPath: "MappingConfigurations[0].InterfaceReference", QualifierType: SMT/Cardinality}
      - {ChangeOperation: RemoveSME, ElementPath: "MappingConfigurations[0].InterfaceReference"}
      # the emptied entry of v1.0 is removed; the new entry takes its place
      - {ChangeOperation: RemoveSME, ElementPath: "MappingConfigurations[0]"}
