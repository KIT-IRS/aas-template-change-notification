[project]
name = "tcn"
version = "0.1.0"
description = "Minimal demonstrator of Template Change Notifications (TCN) for AAS Submodel Templates"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Marcel Auer", email = "marcel.auer@kit.edu" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "aas-core3-1>=1.0.0",
    "cel-python>=0.5.0",
    "paho-mqtt>=2.1.0",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
]

[project.scripts]
tcn = "tcn.cli:main"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["validation"]
pythonpath = ["."]
markers = ["infra: requires the Docker environment (BaSyx + RabbitMQ)"]
