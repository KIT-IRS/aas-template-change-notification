# Template Change Notification: IDTA 02005 Provision of Simulation Models v1.0 -> v1.1 (intent, hand-written)
#
# This file states the intent of the revision. `uv run tcn owner complete` appends the mechanical
# completion; the result is simulationmodels_1.0_to_1.1.yaml.
# The change log of v1.1 (Annex B) lists the new collection Quality and changed semanticIds of the
# submodel and of SimulationModel. All three are additions or attribute values without a counterpart
# in v1.0, so the owner states no intent; the mechanical completion states them. The change log names
# https://admin-shell.io/idta/SimulationModels/SimulationModels/1/1 as the new semanticId of the
# submodel, whereas the published template carries https://admin-shell.io/idta/SubmodelTemplate/SimulationModels/1/1;
# the corrected semanticIds of PortConDescription and SimToolName (namespace SimulationModel ->
# SimulationModels) are not listed. The chain states the published template.

