    ElementPath: Records[0].AffectedPartNumbers[0]
    AttributeKey: description
    AttributeValue:
    - language: en
      text: 'Note: This Property codes only part number ("12345"), a set of part numbers ("12345;23456;34567"), a range of
        part numbers("10000-19999"). For each of these, wildcards like asterix ("1*8", all numbers starting with ''1'' and
        ending with ''8'') or question mark ("1?3?8", all 5 digit numbers starting with ''1'' and ending with ''8'' and middle
