      - {ChangeOperation: CreateAttr, ElementPath: ManufacturerProductTypeRetyped, AttributeKey: value}
      - {ChangeOperation: Sync, SourceElementPaths: ["ManufacturerProductType#value"], TargetElementPaths: ["ManufacturerProductTypeRetyped#value"],
         TransferFunction: *mlp_to_string}
      - {ChangeOperation: CreateQual, ElementPath: ManufacturerProductTypeRetyped, QualifierType: SMT/Cardinality}
      - {ChangeOperation: UpdateAttr, ElementPath: ManufacturerProductTypeRetyped, QualifierType: SMT/Cardinality, AttributeKey: valueType,
         AttributeValue: xs:string}
      - {ChangeOperation: CreateAttr, ElementPath: ManufacturerProductTypeRetyped, QualifierType: SMT/Cardinality, AttributeKey: value}
      - {ChangeOperation: Sync, SourceElementPaths: ["ManufacturerProductType@Multiplicity#value"],
         TargetElementPaths: ["ManufacturerProductTypeRetyped@SMT/Cardinality#value"], TransferFunction: {Kind: Identity}}
      - {ChangeOperation: RemoveQual, ElementPath: ManufacturerProductType, QualifierType: Multiplicity}
      - {ChangeOperation: RemoveSME, ElementPath: ManufacturerProductType}
      - {ChangeOperation: UpdateIdShort, ElementPath: ManufacturerProductTypeRetyped, NewIdShort: ManufacturerProductType}
      # OrderCodeOfManufacturer
      - {ChangeOperation: CreateSME, ElementPath: OrderCodeOfManufacturerRetyped, SMEType: Property}
      - {ChangeOperation: UpdateAttr, ElementPath: OrderCodeOfManufacturerRetyped, AttributeKey: valueType, AttributeValue: xs:string}
      - {ChangeOperation: CreateAttr, ElementPath: OrderCodeOfManufacturerRetyped, AttributeKey: value}
      - {ChangeOperation: Sync, SourceElementPaths: ["OrderCodeOfManufacturer#value"], TargetElementPaths: ["OrderCodeOfManufacturerRetyped#value"],
         TransferFunction: *mlp_to_string}
      - {ChangeOperation: CreateQual, ElementPath: OrderCodeOfManufacturerRetyped, QualifierType: SMT/Cardinality}
      - {ChangeOperation: UpdateAttr, ElementPath: OrderCodeOfManufacturerRetyped, QualifierType: SMT/Cardinality, AttributeKey: valueType,
         AttributeValue: xs:string}
      - {ChangeOperation: CreateAttr, ElementPath: OrderCodeOfManufacturerRetyped, QualifierType: SMT/Cardinality, AttributeKey: value}
      - {ChangeOperation: Sync, SourceElementPaths: ["OrderCodeOfManufacturer@Multiplicity#value"],
