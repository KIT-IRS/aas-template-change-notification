- title: 'F1: the entries of the lists no longer carry an idShort; entries with children are rebuilt by hollow-out'
  origin: rule
  rule:
    RenameContainer:
      QualityFeatures.LinearFeaturesList[0]: null
      QualityFeatures.LinearFeaturesList[0].Reference2DList[0]: null
      QualityFeatures.AttributiveFeaturesList[0]: null
      QualityFeatures.AttributiveFeaturesList[0].Reference2DList[0]: null
      QualityFeatures.GeometricFeaturesList[0]: null
      QualityFeatures.GeometricFeaturesList[0].Reference2DList[0]: null
      QualityFeatures.GeometricFeaturesList[0].AdditionalInformationList[0]: null
      QualityFeatures.ArealSurfaceFeaturesList[0]: null
      QualityFeatures.ArealSurfaceFeaturesList[0].Reference2DList[0]: null
      QualityResponsibilityList[0]: null
      TestingDevicesList[0]: null
      MetrologyJobResults.MetrologyResultsList[0]: null
  items:
  - ChangeOperation: CreateSME
    ElementPath: QualityFeatures.LinearFeaturesList[1]
    SMEType: SubmodelElementCollection
  - ChangeOperation: CreateAttr
    ElementPath: QualityFeatures.LinearFeaturesList[1]
    AttributeKey: description
  - ChangeOperation: UpdateAttr
    ElementPath: QualityFeatures.LinearFeaturesList[1]
    AttributeKey: description
    AttributeValue:
    - language: en
      text: 'Description of the definition of a linear quality characteristic such as length, weight, angle, according to
        DIN EN ISO 14405-1: Dimensional tolerancing - Part 1: Linear size dimensions'
    - language: de
      text: 'Beschreibung der Definition eines linearen Qualitätsmerkmals wie z.B. Länge, Gewicht, Winkel, gemäß DIN EN ISO
        14405-1: Dimensionelle Tolerierung – Teil 1: Lineare Größenmaße'
  - ChangeOperation: CreateAttr
    ElementPath: QualityFeatures.LinearFeaturesList[1]
    AttributeKey: semanticId
  - ChangeOperation: UpdateAttr
    ElementPath: QualityFeatures.LinearFeaturesList[1]
    AttributeKey: semanticId
    AttributeValue:
      type: ExternalReference
      keys:
      - type: GlobalReference
        value: https://admin-shell.io/idta/QualityControlForMachining/LinearFeature/1/0
  - ChangeOperation: CreateQual
