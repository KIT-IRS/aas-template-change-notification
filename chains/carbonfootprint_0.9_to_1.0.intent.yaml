# Template Change Notification: IDTA 02023 Carbon Footprint v0.9 -> v1.0 (intent, hand-written)
#
# This file states the intent of the revision. `uv run tcn owner complete` expands the rule sections
# in place and appends the mechanical completion; the result is carbonfootprint_0.9_to_1.0.yaml.
# No change log is published; the specification of v1.0 (1.3.4) states only that the requirements of
# the Battery Passport and the PACT framework were incorporated. The groups are taken from the
# published templates: elements of v0.9 and v1.0 correspond where their ECLASS IRDIs differ in the
# revision only (e.g. 0173-1#02-ABG855#001 -> #003). The transport carbon footprint (TCF) has no
# counterpart in v1.0 (K7). The new ProductOrSectorSpecificCarbonFootprints, the corrected semanticId
# of ExpirationDate (ExpirationnDate) and the changed value type of PcfCO2eq (xs:double -> xs:decimal)
# are stated by the mechanical completion.

header:
  Family: CarbonFootprint
  PreVersion: https://admin-shell.io/idta/SubmodelTemplate/CarbonFootprint/0/9
  PostVersion: https://admin-shell.io/idta/SubmodelTemplate/CarbonFootprint/1/0
  PreTemplate: ressources/Templates/IDTA 02023-0-9_Template_CarbonFootprint.json
  PostTemplate: ressources/Templates/IDTA 02023-1-0_Template_CarbonFootprint.json
  TemplateOwner: Industrial Digital Twin Association (IDTA)
  TemplateOwnerAddress:
    Company: Industrial Digital Twin Association e.V.
    Street: Lyoner Straße 18
    Zipcode: "60528"
    CityTown: Frankfurt am Main
    NationalCode: DE
  ChangeURI: https://github.com/admin-shell-io/submodel-templates/tree/main/published/Carbon%20Footprint/1/0

# Strings of v0.9 become English texts of multi-language properties of the drop-in Address Information.
# Street and house number are one text in v1.0. Dates of v0.9 are strings; v1.0 declares xs:dateTime.
# An expression yields the list of target values; the value of a multi-language target is a list itself.
# An unpopulated source value (null) leaves the target unpopulated.
definitions:
  string_to_mlp: &string_to_mlp
    Kind: Expression
    ExpressionLanguage: https://github.com/google/cel-spec
    Expression: >-
      type(src[0]) == string ? [[{"language": "en", "text": src[0]}]] : null
    Text: {en: "Take the value of the property as the English text of the multi-language property."}
  street_and_number: &street_and_number
    Kind: Expression
    ExpressionLanguage: https://github.com/google/cel-spec
    Expression: >-
      type(src[0]) != string ? null :
      [[{"language": "en", "text": type(src[1]) == string && src[1] != "" ? src[0] + " " + src[1] : src[0]}]]
    Text: {en: "Take street and house number, separated by a blank, as the English text of Street."}
  date_to_datetime: &date_to_datetime
    Kind: Expression
    ExpressionLanguage: https://github.com/google/cel-spec
    Expression: >-
      type(src[0]) != string ? null : src[0].contains("T") ? src[0] : src[0] + "T00:00:00Z"
    Text: {en: "Write the date as a date and time (xs:dateTime), at 00:00:00 UTC unless a time is given."}

sections:
  - title: "K1: ProductCarbonFootprint becomes an entry of the list ProductCarbonFootprints"
    origin: hand
    items:
      - {ChangeOperation: CreateSME, ElementPath: ProductCarbonFootprints, SMEType: SubmodelElementList}
      - {ChangeOperation: UpdateAttr, ElementPath: ProductCarbonFootprints, AttributeKey: typeValueListElement, AttributeValue: SubmodelElementCollection}
      - {ChangeOperation: CreateSME, ElementPath: "ProductCarbonFootprints[0]", SMEType: SubmodelElementCollection}

  - title: "K2: the PCF properties drop their prefix (same ECLASS IRDIs); PCFReferenceValueForCalculation becomes ReferenceImpactUnitForCalculation"
    origin: hand
    items:
      - {ChangeOperation: UpdateIdShort, ElementPath: ProductCarbonFootprint.PCFCO2eq, NewIdShort: PcfCO2eq}
      - {ChangeOperation: UpdateIdShort, ElementPath: ProductCarbonFootprint.PCFReferenceValueForCalculation, NewIdShort: ReferenceImpactUnitForCalculation}
      - {ChangeOperation: UpdateIdShort, ElementPath: ProductCarbonFootprint.PCFQuantityOfMeasureForCalculation, NewIdShort: QuantityOfMeasureForCalculation}
      - {ChangeOperation: UpdateParent, ElementPath: ProductCarbonFootprint.PcfCO2eq, NewParentPath: "ProductCarbonFootprints[0]"}
      - {ChangeOperation: UpdateParent, ElementPath: ProductCarbonFootprint.ReferenceImpactUnitForCalculation, NewParentPath: "ProductCarbonFootprints[0]"}
      - {ChangeOperation: UpdateParent, ElementPath: ProductCarbonFootprint.QuantityOfMeasureForCalculation, NewParentPath: "ProductCarbonFootprints[0]"}
      - {ChangeOperation: UpdateParent, ElementPath: ProductCarbonFootprint.ExplanatoryStatement, NewParentPath: "ProductCarbonFootprints[0]"}
      - {ChangeOperation: UpdateParent, ElementPath: ProductCarbonFootprint.PublicationDate, NewParentPath: "ProductCarbonFootprints[0]"}
      - {ChangeOperation: UpdateParent, ElementPath: ProductCarbonFootprint.ExpirationDate, NewParentPath: "ProductCarbonFootprints[0]"}

  - title: "K3: the repeatable PCFCalculationMethod becomes the list PcfCalculationMethods; each method is one entry"
    origin: hand
    items:
      - {ChangeOperation: CreateSME, ElementPath: "ProductCarbonFootprints[0].PcfCalculationMethods", SMEType: SubmodelElementList}
      - {ChangeOperation: UpdateAttr, ElementPath: "ProductCarbonFootprints[0].PcfCalculationMethods", AttributeKey: typeValueListElement, AttributeValue: Property}
      - {ChangeOperation: CreateSME, ElementPath: "ProductCarbonFootprints[0].PcfCalculationMethods[0]", SMEType: Property}
      - {ChangeOperation: UpdateAttr, ElementPath: "ProductCarbonFootprints[0].PcfCalculationMethods[0]", AttributeKey: valueType, AttributeValue: xs:string}
      - {ChangeOperation: CreateAttr, ElementPath: "ProductCarbonFootprints[0].PcfCalculationMethods[0]", AttributeKey: value}
      - {ChangeOperation: CreateAttr, ElementPath: ProductCarbonFootprint.PCFCalculationMethod, AttributeKey: value}
      - {ChangeOperation: Sync, SourceElementPaths: ["ProductCarbonFootprint.PCFCalculationMethod#value"],
         TargetElementPaths: ["ProductCarbonFootprints[0].PcfCalculationMethods[0]#value"], TransferFunction: {Kind: Identity}}
      - {ChangeOperation: RemoveQual, ElementPath: ProductCarbonFootprint.PCFCalculationMethod, QualifierType: Cardinality}
      - {ChangeOperation: RemoveSME, ElementPath: ProductCarbonFootprint.PCFCalculationMethod}

  - title: "K4: the repeatable PCFLifeCyclePhase becomes the list LifeCyclePhases; each phase is one entry"
    origin: hand
    items:
      - {ChangeOperation: CreateSME, ElementPath: "ProductCarbonFootprints[0].LifeCyclePhases", SMEType: SubmodelElementList}
      - {ChangeOperation: UpdateAttr, ElementPath: "ProductCarbonFootprints[0].LifeCyclePhases", AttributeKey: typeValueListElement, AttributeValue: Property}
      - {ChangeOperation: CreateSME, ElementPath: "ProductCarbonFootprints[0].LifeCyclePhases[0]", SMEType: Property}
      - {ChangeOperation: UpdateAttr, ElementPath: "ProductCarbonFootprints[0].LifeCyclePhases[0]", AttributeKey: valueType, AttributeValue: xs:string}
      - {ChangeOperation: CreateAttr, ElementPath: "ProductCarbonFootprints[0].LifeCyclePhases[0]", AttributeKey: value}
      - {ChangeOperation: CreateAttr, ElementPath: ProductCarbonFootprint.PCFLifeCyclePhase, AttributeKey: value}
      - {ChangeOperation: Sync, SourceElementPaths: ["ProductCarbonFootprint.PCFLifeCyclePhase#value"],
         TargetElementPaths: ["ProductCarbonFootprints[0].LifeCyclePhases[0]#value"], TransferFunction: {Kind: Identity}}
      - {ChangeOperation: RemoveQual, ElementPath: ProductCarbonFootprint.PCFLifeCyclePhase, QualifierType: Cardinality}
      - {ChangeOperation: RemoveSME, ElementPath: ProductCarbonFootprint.PCFLifeCyclePhase}

  - title: "K5: PCFGoodsAddressHandover becomes GoodsHandoverAddress, the use of the SMT drop-in Address Information"
    origin: hand
    items:
      - {ChangeOperation: CreateSME, ElementPath: "ProductCarbonFootprints[0].GoodsHandoverAddress", SMEType: SubmodelElementCollection}
      - {ChangeOperation: CreateSME, ElementPath: "ProductCarbonFootprints[0].GoodsHandoverAddress.Street", SMEType: MultiLanguageProperty}
      - {ChangeOperation: CreateAttr, ElementPath: "ProductCarbonFootprints[0].GoodsHandoverAddress.Street", AttributeKey: value}
      - {ChangeOperation: CreateAttr, ElementPath: ProductCarbonFootprint.PCFGoodsAddressHandover.Street, AttributeKey: value}
      - {ChangeOperation: CreateAttr, ElementPath: ProductCarbonFootprint.PCFGoodsAddressHandover.HouseNumber, AttributeKey: value}
      - {ChangeOperation: Sync, SourceElementPaths: ["ProductCarbonFootprint.PCFGoodsAddressHandover.Street#value",
                                                     "ProductCarbonFootprint.PCFGoodsAddressHandover.HouseNumber#value"],
         TargetElementPaths: ["ProductCarbonFootprints[0].GoodsHandoverAddress.Street#value"], TransferFunction: *street_and_number}
      - {ChangeOperation: CreateSME, ElementPath: "ProductCarbonFootprints[0].GoodsHandoverAddress.Zipcode", SMEType: MultiLanguageProperty}
      - {ChangeOperation: CreateAttr, ElementPath: "ProductCarbonFootprints[0].GoodsHandoverAddress.Zipcode", AttributeKey: value}
      - {ChangeOperation: CreateAttr, ElementPath: ProductCarbonFootprint.PCFGoodsAddressHandover.ZipCode, AttributeKey: value}
      - {ChangeOperation: Sync, SourceElementPaths: ["ProductCarbonFootprint.PCFGoodsAddressHandover.ZipCode#value"],
         TargetElementPaths: ["ProductCarbonFootprints[0].GoodsHandoverAddress.Zipcode#value"], TransferFunction: *string_to_mlp}
      - {ChangeOperation: CreateSME, ElementPath: "ProductCarbonFootprints[0].GoodsHandoverAddress.CityTown", SMEType: MultiLanguageProperty}
      - {ChangeOperation: CreateAttr, ElementPath: "ProductCarbonFootprints[0].GoodsHandoverAddress.CityTown", AttributeKey: value}
      - {ChangeOperation: CreateAttr, ElementPath: ProductCarbonFootprint.PCFGoodsAddressHandover.CityTown, AttributeKey: value}
      - {ChangeOperation: Sync, SourceElementPaths: ["ProductCarbonFootprint.PCFGoodsAddressHandover.CityTown#value"],
         TargetElementPaths: ["ProductCarbonFootprints[0].GoodsHandoverAddress.CityTown#value"], TransferFunction: *string_to_mlp}
      - {ChangeOperation: CreateSME, ElementPath: "ProductCarbonFootprints[0].GoodsHandoverAddress.NationalCode", SMEType: MultiLanguageProperty}
      - {ChangeOperation: CreateAttr, ElementPath: "ProductCarbonFootprints[0].GoodsHandoverAddress.NationalCode", AttributeKey: value}
      - {ChangeOperation: CreateAttr, ElementPath: ProductCarbonFootprint.PCFGoodsAddressHandover.Country, AttributeKey: value}
      - {ChangeOperation: Sync, SourceElementPaths: ["ProductCarbonFootprint.PCFGoodsAddressHandover.Country#value"],
         TargetElementPaths: ["ProductCarbonFootprints[0].GoodsHandoverAddress.NationalCode#value"], TransferFunction: *string_to_mlp}
      - {ChangeOperation: RemoveQual, ElementPath: ProductCarbonFootprint.PCFGoodsAddressHandover, QualifierType: Cardinality}
      - {ChangeOperation: RemoveQual, ElementPath: ProductCarbonFootprint.PCFGoodsAddressHandover.Street, QualifierType: Cardinality}
      - {ChangeOperation: RemoveQual, ElementPath: ProductCarbonFootprint.PCFGoodsAddressHandover.HouseNumber, QualifierType: Cardinality}
      - {ChangeOperation: RemoveQual, ElementPath: ProductCarbonFootprint.PCFGoodsAddressHandover.ZipCode, QualifierType: Cardinality}
      - {ChangeOperation: RemoveQual, ElementPath: ProductCarbonFootprint.PCFGoodsAddressHandover.CityTown, QualifierType: Cardinality}
      - {ChangeOperation: RemoveQual, ElementPath: ProductCarbonFootprint.PCFGoodsAddressHandover.Country, QualifierType: Cardinality}
      - {ChangeOperation: RemoveSME, ElementPath: ProductCarbonFootprint.PCFGoodsAddressHandover.Street}
      - {ChangeOperation: RemoveSME, ElementPath: ProductCarbonFootprint.PCFGoodsAddressHandover.HouseNumber}
      - {ChangeOperation: RemoveSME, ElementPath: ProductCarbonFootprint.PCFGoodsAddressHandover.ZipCode}
      - {ChangeOperation: RemoveSME, ElementPath: ProductCarbonFootprint.PCFGoodsAddressHandover.CityTown}
      - {ChangeOperation: RemoveSME, ElementPath: ProductCarbonFootprint.PCFGoodsAddressHandover.Country}
      - {ChangeOperation: RemoveSME, ElementPath: ProductCarbonFootprint.PCFGoodsAddressHandover}

  - title: "K1: the emptied ProductCarbonFootprint is removed"
    origin: hand
    items:
      - {ChangeOperation: RemoveQual, ElementPath: ProductCarbonFootprint, QualifierType: Cardinality}
      - {ChangeOperation: RemoveSME, ElementPath: ProductCarbonFootprint}

  - title: "K6: PublicationDate and ExpirationDate become dates with time (xs:dateTime)"
    origin: hand
    items:
      - {ChangeOperation: UpdateAttr, ElementPath: "ProductCarbonFootprints[0].PublicationDate", AttributeKey: valueType, AttributeValue: xs:dateTime}
      - {ChangeOperation: CreateAttr, ElementPath: "ProductCarbonFootprints[0].PublicationDate", AttributeKey: value}
      - {ChangeOperation: Sync, SourceElementPaths: ["ProductCarbonFootprints[0].PublicationDate#value"],
         TargetElementPaths: ["ProductCarbonFootprints[0].PublicationDate#value"], TransferFunction: *date_to_datetime}
      - {ChangeOperation: UpdateAttr, ElementPath: "ProductCarbonFootprints[0].ExpirationDate", AttributeKey: valueType, AttributeValue: xs:dateTime}
      - {ChangeOperation: CreateAttr, ElementPath: "ProductCarbonFootprints[0].ExpirationDate", AttributeKey: value}
      - {ChangeOperation: Sync, SourceElementPaths: ["ProductCarbonFootprints[0].ExpirationDate#value"],
         TargetElementPaths: ["ProductCarbonFootprints[0].ExpirationDate#value"], TransferFunction: *date_to_datetime}

  - title: "K7: the transport carbon footprint (TCF) has no counterpart in v1.0"
    origin: rule
    rule:
      RemoveSubtree: [TransportCarbonFootprint]

  - title: "K8: the cardinality vocabulary changes from Cardinality to SMT/Cardinality"
    origin: rule
    rule:
      QualifierTypeRenames: {Cardinality: SMT/Cardinality}
