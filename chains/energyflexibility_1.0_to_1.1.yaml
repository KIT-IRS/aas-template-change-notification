    AttributeKey: description
    AttributeValue:
    - language: en
      text: Latest possible time by which confirmation of an accepted offer of the Flexible Load must have been received.
        By this time, the flexibility provider needs to know whether the Flexible Load must be held ready. After the Booking
        Confirmation Deadline is exceeded, the Flexible Load offer is removed from the market. The Order Confirmation Deadline
        can be specified EITHER absolutely with a fixed time OR relative to the start time of the Flexible-Load Measure (e.g.
        100 seconds before the start of a FLM). If no value is specified, constant availability for offering is assumed until
        the latest possible start time within the Validity Period minus the Reaction Duration.
