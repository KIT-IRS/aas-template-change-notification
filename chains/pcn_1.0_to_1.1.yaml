  - ChangeOperation: UpdateAttr
    ElementPath: Records[0].Manufacturer.PhysicalAddress__0__
    AttributeKey: description
    AttributeValue:
    - language: en
      text: 'Note: This set of information is defined by SMT drop-in "Contact Information" in (current) version 1.0, given
        by the SMT for Contact and Address Information V1.0. The ECLASS IRDI reserved for the SMC was added as supplementalSemanticId.  Note:
        Use this set of information, until version 1.1 of the SMT drop-in "Contact Information" is published. Note: The idShort
        shall go without the index "__0__".'
  - ChangeOperation: UpdateAttr
    ElementPath: Records[0].Manufacturer.PhysicalAddress__1__
    AttributeKey: description
    AttributeValue:
    - language: en
      text: 'Note: this set of information is defined by SMT drop-in "Contact Information" in upcoming version 1.1, given
        by the SMT for Contact and Address Information V1.1. The ECLASS IRDI reserved for the SMC was added as supplementalSemanticId.  Note:
        Use this set of information, if version 1.1 of the SMT drop-in "Contact Information" is published. Note: The idShort
        shall go without the index "__1__".'
  - ChangeOperation: UpdateAttr
    ElementPath: Records[0].PcnType
    AttributeKey: description
    AttributeValue:
    - language: en
      text: 'Note: Following the VDMA 24903, this mandatory global flag distincts between a PCN and PDN. Use either value
        PCN or PDN with valueId 0173-1#07-ABU000#003 (PCN) or 0173-1#07-ABU001#003 (PDN). Note: According this global flag,
        the PCN milestone (173-1#07-ABU000#003) communicates the effective date of the PCN and the EOP milestone (EOP milestone
        (0173-1#07-ABU003#003) communicates the end of production date for the PDN in the life-cycle data.'
  - ChangeOperation: UpdateAttr
    ElementPath: Records[0].LifeCycleData[0].MilestoneClassification
    AttributeKey: description
    AttributeValue:
    - language: en
      text: 'Note: defined point in time with a specific meaning for life-cycle management (IEC 62890:2020). Note: Set value
        and valueId with one of these: SOP (0173-1#07-ABT998#003),  NRND (0173-1#07-ABT999#003),  PCN (0173-1#07-ABU000#003),  EOS
        (0173-1#07-ABU002#003),  EOP (0173-1#07-ABU003#003),  LTD (0173-1#07-ABU004#003),  EOSR (0173-1#07-ABU087#003) Note:
        The PDN milestone is not to be used for this classification. Instead, the global flag PcnType is set with value=PCN
        and valueId=0173-1#07-ABU000#003.'
  - ChangeOperation: UpdateAttr
    ElementPath: Records[0].ReasonsOfChange
    AttributeKey: description
    AttributeValue:
    - language: en
      text: 'Note: Multiple classification systems might be used. Constraint: At least one reason according VDM24903 shall
        be given.'
  - ChangeOperation: UpdateAttr
    ElementPath: Records[0].ReasonsOfChange[0].VersionOfClassificationSystem
    AttributeKey: description
    AttributeValue:
    - language: en
      text: 'Common version identifier of the used classification system, in order to distinguish different version of the
        property dictionary.  Note: Casing is to be ignored.'
    - language: de
      text: 'Note: 4 digit year of publication date of classifcation standard can serve as version.'
  - ChangeOperation: UpdateAttr
    ElementPath: Records[0].ItemCategories
