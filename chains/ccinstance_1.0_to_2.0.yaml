    QualifierType: Multiplicity
- title: 'C4: the Name property is removed from the Skill and Parameter SMCs in favor of freely choosable idShort values'
  origin: rule
  rule:
    RemoveSubtree:
    - Skills.Skill.Name
    - Skills.Skill.Parameters.Parameter.Name
  items:
  - ChangeOperation: RemoveQual
    ElementPath: Skills.Skill.Name
    QualifierType: Multiplicity
  - ChangeOperation: RemoveSME
    ElementPath: Skills.Skill.Name
  - ChangeOperation: RemoveQual
    ElementPath: Skills.Skill.Parameters.Parameter.Name
    QualifierType: Multiplicity
  - ChangeOperation: RemoveSME
    ElementPath: Skills.Skill.Parameters.Parameter.Name
- title: 'C5: the DisplayName MLP is removed from the Skill SMC, as it is now represented in the AAS metamodel'
  origin: rule
