    ElementPath: Endpoints.Endpoint
    QualifierType: SMT/Cardinality
    AttributeKey: valueType
    AttributeValue: xs:string
  - ChangeOperation: CreateAttr
    ElementPath: Endpoints.Endpoint
    QualifierType: SMT/Cardinality
    AttributeKey: value
  - ChangeOperation: Sync
    SourceElementPaths:
    - Endpoints.Endpoint.EndpointReference@Multiplicity#value
    TargetElementPaths:
    - Endpoints.Endpoint@SMT/Cardinality#value
    TransferFunction:
      Kind: Identity
