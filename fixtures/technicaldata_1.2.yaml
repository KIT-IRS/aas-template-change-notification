# Submodel instance conforming to IDTA 02003 Technical Data v1.2. Illustrative values of an example device.
template: ressources/Templates/IDTA_02003-1-2_Template_TechnicalData.json
id: https://example.com/ids/sm/example-device/TechnicalData

omit:
  - TechnicalProperties.SubSection        # optional; has no counterpart in v2.0

repeat:
  GeneralInformation.ProductImage: [ProductImage01, ProductImage02]
  ProductClassifications.ProductClassificationItem: [ProductClassificationItem01, ProductClassificationItem02]
  TechnicalProperties.MainSection: [MainSection01]
  TechnicalProperties.MainSection01.SubSection: [SubSection01]
  FurtherInformation.TextStatement: [TextStatement01]

values:
  GeneralInformation.ManufacturerName: Example Manufacturer GmbH
  GeneralInformation.ManufacturerProductDesignation: {en: Compact I/O controller, de: Kompakter I/O-Controller}
  GeneralInformation.ManufacturerArticleNumber: EX-100-200
  GeneralInformation.ManufacturerOrderCode: EX100200
  GeneralInformation.ManufacturerLogo: /aasx/files/logo.png
  GeneralInformation.ProductImage01: /aasx/files/front.jpg
  GeneralInformation.ProductImage02: /aasx/files/side.jpg
  ProductClassifications.ProductClassificationItem01.ProductClassificationSystem: ECLASS
  ProductClassifications.ProductClassificationItem01.ClassificationSystemVersion: "13.0"
  ProductClassifications.ProductClassificationItem01.ProductClassId: 27-24-22-01
  ProductClassifications.ProductClassificationItem02.ProductClassificationSystem: UNSPSC
  ProductClassifications.ProductClassificationItem02.ProductClassId: "32151705"
  FurtherInformation.TextStatement01: {en: For indoor use only}
  FurtherInformation.ValidDate: "2025-06-30"

add:
  GeneralInformation:   # local extension of the asset maintainer, described by no template
    - {modelType: Property, idShort: InternalInventoryNumber, valueType: xs:string, value: INV-2024-0815}
  TechnicalProperties:
    - {modelType: Property, idShort: Width, valueType: xs:double, value: "62.4",
       semanticId: {type: ExternalReference, keys: [{type: GlobalReference, value: 0173-1#02-AAB950#006}]}}
    - {modelType: Property, idShort: Weight, valueType: xs:double, value: "0.21",
       semanticId: {type: ExternalReference, keys: [{type: GlobalReference, value: 0173-1#02-AAB713#005}]}}
    - {modelType: MultiLanguageProperty, idShort: HousingColour, value: [{language: en, text: light grey}],
       semanticId: {type: ExternalReference, keys: [{type: GlobalReference, value: 0173-1#02-AAN496#002}]}}
  TechnicalProperties.MainSection01.SubSection01:
    - {modelType: Property, idShort: RatedVoltage, valueType: xs:double, value: "24",
       semanticId: {type: ExternalReference, keys: [{type: GlobalReference, value: 0173-1#02-AAC958#004}]}}
