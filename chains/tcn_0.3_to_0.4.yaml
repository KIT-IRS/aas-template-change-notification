    AttributeKey: description
    AttributeValue:
    - language: en
      text: 'One entry per observed Submodel Template. Multiplicity lives in this list: entries are addressed by position
        and carry no idShort, so nothing collides and the entry''s ZeroToMany is satisfiable without any element having to
        be renamed per instance.'
